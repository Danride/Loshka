<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEAD PIXEL — ПРОКЛЯТЫЙ ОСОБНЯК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#7dff8a; --red:#ff3b30; --amber:#ffd23f; --ink:#0a0c14;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%; overflow:hidden; background:#000; color:#fff;
    font-family:'Press Start 2P','Courier New',monospace;
    -webkit-font-smoothing:none; user-select:none;
  }
  #app{position:fixed;inset:0;}
  #c{
    width:100vw; height:100vh; display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:contrast(1.06) saturate(1.12);
  }

  /* ================= HUD ================= */
  #hud{position:fixed;inset:0;pointer-events:none;}

  #crosshair{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);}
  #crosshair i{position:absolute;background:var(--green);box-shadow:0 0 0 2px #0008;}
  #crosshair i:nth-child(1){left:11px;top:0;width:2px;height:8px;}
  #crosshair i:nth-child(2){left:11px;bottom:0;width:2px;height:8px;}
  #crosshair i:nth-child(3){top:11px;left:0;height:2px;width:8px;}
  #crosshair i:nth-child(4){top:11px;right:0;height:2px;width:8px;}
  #crosshair.hit i{background:var(--red);}
  #crosshair.hit{transform:translate(-50%,-50%) scale(1.35);}

  #stats{
    position:fixed;left:18px;top:16px;display:flex;flex-direction:column;gap:10px;
    font-size:11px;letter-spacing:1px;text-shadow:2px 2px 0 #000;
  }
  .stat{color:#9aa4b8;}
  .stat b{color:var(--green);}

  #bottom{
    position:fixed;left:18px;right:18px;bottom:16px;
    display:flex;justify-content:space-between;align-items:flex-end;
    text-shadow:2px 2px 0 #000;
  }
  #health{display:flex;align-items:center;gap:12px;}
  #hpBar{
    width:220px;height:20px;background:#12161f;border:3px solid #2b3346;padding:2px;
    box-shadow:0 0 0 3px #000;
  }
  #hpFill{height:100%;width:100%;background:var(--green);transition:width .12s linear;}
  #hpNum{font-size:14px;color:#dfe7f5;}
  #ammoBox{font-size:26px;letter-spacing:2px;}
  #ammoBox .dim{color:#5b6478;font-size:18px;}
  #ammoNow{color:var(--amber);}

  #msg{
    position:fixed;left:50%;top:26%;transform:translateX(-50%);
    font-size:20px;letter-spacing:3px;color:var(--amber);
    text-shadow:3px 3px 0 #000; opacity:0; transition:opacity .35s;
    white-space:nowrap;
  }
  #msg.show{opacity:1;}

  #flash{
    position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,0,0,0) 30%, rgba(255,20,20,.85) 100%);
    transition:opacity .12s linear;
  }

  /* ================= OVERLAY ================= */
  #overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,9,.88); backdrop-filter:blur(2px); z-index:10;
    text-align:center; padding:20px;
  }
  #overlay.show{display:flex;}
  .panel{
    border:4px solid #2b3346; box-shadow:0 0 0 6px #000, 0 0 60px #7dff8a22;
    padding:34px 40px; background:#0b0e17; max-width:640px;
  }
  .panel h1{
    font-size:34px; color:var(--green); letter-spacing:4px;
    text-shadow:4px 4px 0 #000, 0 0 24px #7dff8a55;
  }
  .panel h2{font-size:14px;color:var(--amber);letter-spacing:8px;margin-top:14px;}
  .panel p{font-size:10px;line-height:2.1;color:#9aa4b8;margin:24px 0;letter-spacing:1px;}
  .panel b{color:#dfe7f5;}
  .panel .key{color:var(--green);}
  #btnStart{
    font-family:inherit;font-size:13px;letter-spacing:3px;cursor:pointer;
    background:#12161f;color:var(--green);border:3px solid var(--green);
    padding:16px 34px;box-shadow:0 0 0 4px #000; transition:all .12s;
  }
  #btnStart:hover{background:var(--green);color:#06120a;transform:translateY(-2px);}
  #btnStart:active{transform:translateY(1px);}
  .arsenal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0;}
  .weapon-card{font:inherit;cursor:pointer;text-align:left;color:#d5d9e5;background:#141925;border:2px solid #343e54;padding:14px 10px;min-height:146px;line-height:2;}
  .weapon-card strong{display:block;font-size:9px;color:#fff;margin-bottom:9px;word-break:break-word;}
  .weapon-card small{display:block;font-size:7px;color:#9ba8b9;line-height:2.1;} .weapon-card .weapon-icon{display:block;font-size:27px;height:35px;color:#d0b27e;line-height:1.25;text-shadow:2px 2px #000;} .weapon-card.selected .weapon-icon{color:#a3ffb0;}
  .weapon-card.selected{border-color:var(--green);background:#1b2d26;box-shadow:inset 0 0 0 1px var(--green);}
  #weaponName{color:var(--amber);font-size:10px;display:block;text-align:right;margin-bottom:9px;}
  #loadout{position:fixed;left:50%;bottom:19px;transform:translateX(-50%);display:flex;gap:5px;align-items:center;pointer-events:auto;}
  .slot{font-family:inherit;font-size:7px;padding:8px 7px;color:#b7bdd0;background:#10131bd9;border:1px solid #485063;cursor:pointer;min-width:83px;text-align:center;line-height:1.9;}
  .slot.active{border-color:#ffd56a;background:#3b3022ec;color:#ffe59b;}
  #location{position:fixed;right:18px;top:16px;font-size:8px;letter-spacing:1px;color:#e0ceab;text-shadow:2px 2px #000;text-align:right;max-width:45vw;line-height:2;}
  .panel{width:min(920px,96vw);max-width:920px;max-height:92vh;overflow:auto;scrollbar-color:#394457 #0b0e17;}
  .panel h1{font-size:30px;}
  .panel h2{font-size:12px;letter-spacing:5px;}
  @media(max-width:850px){.arsenal{grid-template-columns:repeat(3,minmax(0,1fr))}.weapon-card{min-height:105px}.weapon-card .weapon-icon{font-size:19px;height:24px}#loadout{left:50%;bottom:63px}.slot{min-width:52px;font-size:6px;padding:5px 4px}}
  @media(max-width:550px){.panel{padding:20px 14px}.panel h1{font-size:22px}.panel h2{font-size:10px}.arsenal{gap:5px;grid-template-columns:repeat(2,minmax(0,1fr))}.weapon-card{padding:8px 5px;min-height:79px}.weapon-card strong{font-size:8px}.weapon-card small{font-size:7px}.panel p{font-size:8px}#btnStart{font-size:10px;padding:12px}#loadout{gap:2px;bottom:61px}.slot{min-width:42px;font-size:5px;padding:4px 2px}#hpBar{width:100px}#ammoBox{font-size:17px}#stats{font-size:8px}#location{font-size:6px;max-width:50vw}}
  #floorplan{position:fixed;right:16px;top:52px;width:440px;padding:12px;background:#10121ef2;border:2px solid #786952;display:none;pointer-events:none;box-shadow:0 4px 30px #000b;}
  #floorplan.visible{display:block;}
  .plan-heading{font-size:9px;color:#eac891;text-align:center;letter-spacing:1px;margin:0 0 10px;}
  #planCanvas{display:block;width:420px;max-width:100%;height:auto;image-rendering:pixelated;background:#161820;}
  .plan-legend{font-size:7px;color:#a9a6a0;text-align:center;margin:8px 0 0;}
  @media(max-width:550px){#floorplan{right:5px;top:42px;width:calc(100vw - 10px);max-width:348px;padding:5px}.plan-heading{font-size:7px}}

  /* Смартфоны: безопасные отступы, крупные сенсорные зоны, без браузерного скролла */
  body{overscroll-behavior:none;touch-action:pan-y}
  #c{touch-action:none}
  #overlay .panel{touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #touchUI{display:none;position:fixed;inset:0;z-index:6;pointer-events:none;touch-action:none}
  .touch-device #touchUI{display:block}
  .touch-device #loadout{bottom:calc(84px + env(safe-area-inset-bottom));z-index:7}
  .touch-device #bottom{bottom:calc(12px + env(safe-area-inset-bottom))}
  .touch-device #stats{top:calc(10px + env(safe-area-inset-top));left:10px;gap:7px}
  .touch-device #location{top:calc(10px + env(safe-area-inset-top));right:12px}
  .touch-device #msg{top:20%;font-size:clamp(9px,2.1vw,15px);max-width:90vw;white-space:normal;text-align:center;line-height:1.7}
  #joyBase{position:absolute;left:calc(15px + env(safe-area-inset-left));bottom:calc(105px + env(safe-area-inset-bottom));width:120px;height:120px;border:2px solid #9da8b477;border-radius:50%;background:#17233166;pointer-events:auto;touch-action:none}
  #joyKnob{position:absolute;left:34px;top:34px;width:48px;height:48px;border:2px solid #b5f6c1b0;border-radius:50%;background:#7dff8a44;pointer-events:none}
  .touch-button{position:absolute;pointer-events:auto;touch-action:none;border:2px solid #a2c0bd88;border-radius:12px;background:#101a26c9;color:white;font-family:inherit;font-size:10px;text-align:center;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}
  .touch-button:active,.touch-button.pressed{background:#4a734ed9;border-color:var(--green)}
  #fireTouch{right:calc(18px + env(safe-area-inset-right));bottom:calc(121px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border-color:#e7b58d;color:#ffe7ce;background:#6a302bbb}
  #reloadTouch{right:calc(117px + env(safe-area-inset-right));bottom:calc(123px + env(safe-area-inset-bottom));width:64px;height:56px}
  #runTouch{left:calc(132px + env(safe-area-inset-left));bottom:calc(110px + env(safe-area-inset-bottom));width:55px;height:52px}
  #mapTouch{right:calc(16px + env(safe-area-inset-right));top:calc(74px + env(safe-area-inset-top));width:56px;height:44px}
  #pauseTouch{left:calc(12px + env(safe-area-inset-left));top:calc(90px + env(safe-area-inset-top));width:54px;height:42px}
  .touch-device #floorplan{z-index:8;top:calc(123px + env(safe-area-inset-top))}
  .touch-device #loadout .slot{min-width:0;flex:1;font-size:clamp(5px,1.4vw,8px);padding:9px 4px;min-height:38px;white-space:nowrap}
  .touch-device #loadout{width:min(96vw,560px);gap:3px}
  .touch-device #hud #bottom{pointer-events:none}
  #overlay{overscroll-behavior:contain}
  #overlay .panel{max-height:min(90dvh,92vh)}
  .main-actions{display:grid;grid-template-columns:1fr;gap:13px;max-width:390px;margin:25px auto 0}
  .menu-btn{font:inherit;cursor:pointer;background:#151c28;color:#e8f4e9;border:2px solid #51616a;padding:15px 18px;font-size:10px;line-height:1.6}
  .menu-btn.primary{border-color:var(--green);color:var(--green)}
  .menu-btn:active{background:#315a3b}
  .main-desc{line-height:2.3}
  @media(pointer:coarse){.panel p{line-height:2}.weapon-card{touch-action:pan-y}}
  @media(max-width:720px){.panel{padding:18px 12px!important}.panel h1{font-size:clamp(19px,4vw,29px)}.arsenal{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}.weapon-card{min-height:80px;padding:9px}.weapon-card strong{font-size:8px;margin:1px 0}.weapon-card small{font-size:7px;line-height:1.65}.weapon-card .weapon-icon{height:20px;font-size:18px}.panel p{margin:10px 0;font-size:7px}#hpBar{width:105px}#hpNum{font-size:11px}#ammoBox{font-size:19px}#weaponName{font-size:8px}}
  @media(max-height:500px){#joyBase{width:98px;height:98px;bottom:70px}#joyKnob{left:27px;top:27px;width:42px;height:42px}#fireTouch{width:76px;height:76px;bottom:82px}#reloadTouch{bottom:86px;right:106px}#runTouch{bottom:75px;left:110px} .touch-device #loadout{bottom:43px}.touch-device #bottom{bottom:4px} .touch-device #stats{font-size:7px}.touch-device #location{font-size:6px}}
  .big{font-size:26px;color:var(--red);letter-spacing:4px;text-shadow:4px 4px 0 #000;}

  /* Separate main menu: full-height action column + low-poly character preview */
  #overlay.main-menu-overlay{background:linear-gradient(117deg,#0b0d14f8,#171d25f7 46%,#241e22ed);padding:clamp(10px,3vw,38px)}
  #overlay.main-menu-overlay .panel{max-width:1120px;width:min(1120px,98vw);border-color:#605449;overflow:hidden;padding:0;background:#11151e}
  .main-hero{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);min-height:min(625px,86dvh);text-align:left}
  .main-menu-copy{padding:clamp(26px,4vw,55px);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
  .main-menu-copy h1{font-size:clamp(24px,3vw,43px);line-height:1.5;letter-spacing:2px}
  .main-menu-copy h2{font-size:clamp(10px,1vw,14px);line-height:1.75;letter-spacing:2px;margin-top:6px}
  .menu-kicker{color:#b6b1ad;line-height:2.5;font-size:8px;max-width:390px;margin:28px 0 12px}
  .main-menu-copy .main-actions{margin:12px 0 0;max-width:380px;width:100%;display:grid;gap:12px}
  .main-menu-copy .menu-btn{text-align:left;padding:17px 20px;font-size:11px;transition:border-color .1s,background .1s}
  .main-menu-copy .menu-btn:hover{border-color:#b8c7bd;background:#263139}
  .menu-minor{background:transparent;border:0;color:#aeb9ba;font-family:inherit;text-align:left;margin-top:25px;padding:9px 1px;font-size:8px;cursor:pointer}
  .menu-wallet{font-size:8px;color:#f5cb73;line-height:2.4;margin-top:20px}
  .menu-preview{position:relative;min-height:460px;overflow:hidden;background:radial-gradient(ellipse at 52% 61%,#39414b 0%,#25262c 39%,#0e101a 73%)}
  .menu-preview:before{content:'';position:absolute;inset:10px;border:1px solid #aaa48e35;pointer-events:none;z-index:1}
  .menu-preview:after{content:'ПЕРСОНАЖ / ВЫЖИВШИЙ';position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#aeb1ac;font-size:8px;letter-spacing:2px;pointer-events:none}
  #menuCharacter{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
  #menuCharacter canvas{height:100%!important;width:auto!important;max-width:100%;object-fit:contain;image-rendering:pixelated}
  .sub-screen .panel{max-width:850px}
  .sub-screen .panel p{line-height:2.1}
  .upgrade-list,.shop-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0 25px;text-align:left}
  .upgrade-item{background:#141a26;border:2px solid #3a4450;padding:18px 15px;min-height:145px;display:flex;flex-direction:column;gap:12px}
  .upgrade-item h3{color:#e8f0e7;font-size:9px;line-height:1.8}
  .upgrade-item p{font-size:8px;color:#aab4b9;line-height:2;margin:0;flex:1}
  .upgrade-item button{font:inherit;font-size:8px;padding:11px 5px;cursor:pointer;background:#22382d;color:#a2f3b1;border:1px solid #6ab77b;line-height:1.6}
  .upgrade-item button:disabled{opacity:.4;cursor:not-allowed}
  .sub-menu-header{display:flex;align-items:center;justify-content:space-between;gap:15px}
  .sub-menu-header h1{font-size:clamp(17px,2.5vw,25px)}
  .wallet{color:#f5cb73;font-size:9px;white-space:nowrap}
  @media(max-width:680px){
   #overlay.main-menu-overlay{padding:5px;align-items:stretch}
   #overlay.main-menu-overlay .panel{width:100%;max-height:100dvh;overflow:auto}
   .main-hero{grid-template-columns:1fr;min-height:0}
   .main-menu-copy{padding:20px 18px 12px}
   .main-menu-copy h1{font-size:24px}
   .menu-kicker{margin:9px 0 5px;font-size:7px;line-height:2}
   .main-menu-copy .main-actions{gap:7px;margin:8px 0 0}
   .main-menu-copy .menu-btn{padding:11px;font-size:9px}
   .menu-wallet{margin-top:9px}
   .menu-minor{margin-top:6px}
   .menu-preview{min-height:245px;max-height:37dvh}
   .menu-preview:after{bottom:12px;font-size:6px}
   .upgrade-list,.shop-list{grid-template-columns:1fr;gap:8px}
   .upgrade-item{min-height:115px;padding:12px}
  }
  @media(max-height:470px) and (min-width:681px){.main-hero{min-height:0;height:88dvh}.menu-preview{min-height:0}.main-menu-copy{padding:18px}.main-menu-copy .menu-btn{padding:9px}.menu-kicker{margin:8px 0}}

</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>

  <div id="stats">
    <div class="stat">ВОЛНА <b id="uiWave">1</b></div>
    <div class="stat">ФРАГИ <b id="uiKills">0</b></div>
    <div class="stat">ЗОМБИ <b id="uiAlive">0</b></div>
  </div>

  <div id="floorplan"><div class="plan-heading">ПЛАН ОСОБНЯКА — M</div><canvas id="planCanvas" width="420" height="280"></canvas><div class="plan-legend">● ИГРОК &nbsp; ● ЗОМБИ &nbsp; ▪ МЕБЕЛЬ</div></div>
  <div id="location">ОСОБНЯК / ЦЕНТРАЛЬНЫЙ ЗАЛ</div>
  <div id="loadout"></div>
  <div id="bottom">
    <div id="health">
      <div id="hpBar"><div id="hpFill"></div></div>
      <div id="hpNum">100</div>
    </div>
    <div id="ammoBox"><span id="weaponName">ПИСТОЛЕТ</span>
      <span id="ammoNow">12</span><span class="dim"> / </span><span id="ammoRes" class="dim">84</span>
    </div>
  </div>

  <div id="msg"></div>
</div>

<div id="flash"></div>

<div id="touchUI" aria-label="Сенсорное управление">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button class="touch-button" id="fireTouch" aria-label="Стрелять">ОГОНЬ</button>
  <button class="touch-button" id="reloadTouch" aria-label="Перезарядить">R</button>
  <button class="touch-button" id="runTouch" aria-label="Бежать">БЕГ</button>
  <button class="touch-button" id="mapTouch" aria-label="Карта">КАРТА</button>
  <button class="touch-button" id="pauseTouch" aria-label="Пауза">II</button>
</div>
<div id="overlay" class="show"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   0. ХЕЛПЕРЫ
   ============================================================ */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const rndInt= (a,b)=> Math.floor(rnd(a,b+1));

/* ============================================================
   1. ЗВУК (полностью синтезированный, 8-бит)
   ============================================================ */
let actx = null;
function audioInit(){
  if(actx) return;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
}
function sNoise(dur, vol, cut, type){
  if(!actx) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3.2);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = type||'lowpass'; f.frequency.value = cut||2000;
  const g = actx.createGain(); g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start();
}
function sBeep(freq, dur, vol, type, slideTo){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = type||'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
const SFX = {
  shot(){ sNoise(0.16, 0.55, 1700); sBeep(120, 0.09, 0.22, 'square', 45); },
  dry(){  sBeep(180, 0.05, 0.12, 'square'); },
  reload(){ sBeep(320, 0.05, 0.12, 'square'); setTimeout(()=>sBeep(220,0.07,0.12,'square'),160); },
  hit(){  sBeep(520, 0.05, 0.16, 'square', 300); },
  head(){ sBeep(880, 0.09, 0.2, 'square', 200); sNoise(0.12,0.3,900); },
  kill(){ sBeep(140, 0.22, 0.16, 'sawtooth', 60); },
  groan(){ sBeep(rnd(60,95), rnd(0.35,0.6), 0.10, 'sawtooth', rnd(35,55)); },
  hurt(){ sNoise(0.22, 0.4, 500, 'highpass'); sBeep(90,0.2,0.2,'square',50); },

function pixelTexture(size, fn, repeat){
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const c = fn(x, y);
    const i = (y*size + x) * 4;
    img.data[i]   = c[0];
    img.data[i+1] = c[1];
    img.data[i+2] = c[2];
    img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if(repeat) t.repeat.set(repeat, repeat);
  return t;
}

const groundTex = pixelTexture(32, (x,y)=>{
  const n = Math.random();
  let v = 34 + n*22;
  if((x*3 + y*7) % 29 === 0) v += 18;        // трещины
  if(n > 0.965) v += 26;                     // мусор
  return [v*0.9|0, v*0.95|0, v*1.1|0];
}, 24);

const pick=a=>a[Math.floor(Math.random()*a.length)];

const corpses=[];
function makeZombie(){
 const roll=Math.random();
 const type=wave>=7&&roll<.16?'armored':wave>=5&&roll<.34?'brute':wave>=2&&roll<.64?'runner':'walker';
 const root=new THREE.Group();
 const stats={
  walker:{hp:125,speed:1.65,damage:14,attack:1.22},
  runner:{hp:94,speed:3.05,damage:11,attack:.67},
  brute:{hp:310,speed:1.1,damage:27,attack:1.55},
  armored:{hp:245,speed:1.45,damage:20,attack:1.07}
 }[type];
 const z={root,type,hp:stats.hp+Math.min(100,wave*5),maxHp:stats.hp+Math.min(100,wave*5),
    attackDamage:stats.damage,attackRate:stats.attack,headArmor:type==='armored'?.43:1,
    speed:stats.speed+Math.min(.55,wave*.035),
    phase:rnd(0,6.28),atkCd:rnd(.1,.5),attackT:0,hitT:0,dead:false,deathT:0,turn:0,fallSide:1,headDeath:false,deathLength:9.5};
 if(type==='brute')root.scale.set(1.37,1.28,1.37);
 else if(type==='runner')root.scale.set(.89,.92,.89);
 else if(type==='armored')root.scale.set(1.14,1.10,1.14);
 // Actual user-provided bald mutant model. Each limb is one merged draw call,
 // with independently animated pivot joints and exact headshot hitbox.
 z.hips=new THREE.Group();root.add(z.hips);
 z.asset=MUTANT_ASSET.instance(type==='runner'?0xf5dfd8:type==='brute'?0xe2c0ab:type==='armored'?0xa4b0ba:0xffffff);
 z.hips.add(z.asset.root);
 for(const m of z.asset.meshes)m.userData.z=z;
 z.chest=z.asset.joints.torso;z.neck=z.asset.joints.head;
 z.armL=z.asset.joints.leftArm;z.armR=z.asset.joints.rightArm;
 z.legL=z.asset.joints.leftLeg;z.legR=z.asset.joints.rightLeg;
 // Keeping the original hooks for death animation without adding extra meshes.
 z.kneeL=new THREE.Group();z.kneeR=new THREE.Group();
 // Spawn in remote rooms away from walls and the player's current location.
 let px=25.5,pz=17,best=-Infinity;
 for(let i=0;i<55;i++){
  const [rx,rz]=pick(spawnRooms),cx=rx+rnd(-4.2,4.2),cz=rz+rnd(-4.2,4.2);
  if(obstructed(cx,cz,.75)||!navWalkable[navCell(cx,cz)])continue;
  const straight=Math.hypot(cx-camera.position.x,cz-camera.position.z);
  const route=navField[navCell(cx,cz)]*NAV_STEP;
  if(straight<11||straight>42||route>65)continue;
  // A nearby room is scarier than an enemy that needs a minute to reach the player.
  const score=-Math.abs(route-27)+rnd(-4,4);
  if(score>best){best=score;px=cx;pz=cz;}
 }
 if(best===-Infinity){
  for(let i=0;i<65;i++){
   const [rx,rz]=pick(spawnRooms),cx=rx+rnd(-4,4),cz=rz+rnd(-4,4);
   if(obstructed(cx,cz,.7)||!navWalkable[navCell(cx,cz)])continue;
   px=cx;pz=cz;break;
  }
 }
 root.position.set(px,0,pz);scene.add(root);zombies.push(z);return z;
}
function animateZombie(z,dt,moving,dist){
 const speedMult=z.type==='runner'?1.9:z.type==='brute'?.78:1;
 z.phase+=dt*(moving?6.6*speedMult:1.5);
 const phase=z.phase,sw=Math.sin(phase),cs=Math.cos(phase),b=z.asset.base;
 const walk=moving?1:0;
 z.legL.rotation.x=b.leftLeg.x+sw*.63*walk;
 z.legR.rotation.x=b.rightLeg.x-sw*.63*walk;
 z.legL.rotation.z=b.leftLeg.z+.02*sw;
 z.legR.rotation.z=b.rightLeg.z-.02*sw;
 z.hips.position.y=walk?Math.abs(cs)*.045:Math.sin(phase)*.009;
 z.hips.rotation.z=Math.sin(phase*.5)*.042;
 z.chest.rotation.set(b.torso.x-.065+Math.sin(phase)*.038,b.torso.y,b.torso.z+Math.sin(phase*.5)*.075);
 z.neck.rotation.set(b.head.x+.018+Math.sin(phase*.72)*.05,b.head.y,b.head.z+Math.sin(phase*.52)*.04);
 z.armL.rotation.set(b.leftArm.x-.42+Math.sin(phase)*.23*walk,b.leftArm.y,b.leftArm.z-.10);
 z.armR.rotation.set(b.rightArm.x-.48-Math.sin(phase)*.23*walk,b.rightArm.y,b.rightArm.z+.10);
 if(z.attackT>0){
  z.attackT-=dt;
  const t=clamp(z.attackT/.50,0,1),lunge=Math.sin((1-t)*Math.PI);
  z.chest.rotation.x-=lunge*.22;
  z.armL.rotation.x-=lunge*.8;
  z.armR.rotation.x-=lunge*.83;
 }
 if(z.hitT>0){
  z.hitT-=dt;
  z.chest.rotation.z+=Math.sin(z.hitT*38)*.15*z.hitT;
  z.neck.rotation.x-=z.hitT*.13;
 }
}
function updateCorpses(dt){
 for(let i=corpses.length-1;i>=0;i--){
  const z=corpses[i];z.deathT+=dt;
  const t=z.deathT;
  // Phase 1: visible recoil (.0-.20s), before the body starts to crumple.
  const recoil=clamp(t/.20,0,1);
  // Phase 2: gravity-driven collapse (.20-1.34s) about the PELVIS, not world origin.
  const fall=clamp((t-.20)/1.14,0,1);
  const eased=fall*fall*(3-2*fall);
  const kick=Math.sin(fall*Math.PI)*.10;
  z.fallRig.rotation.x=(z.headDeath?-.24:.23)*recoil+(z.headDeath?-1.58:1.50)*eased;
  z.fallRig.rotation.z=z.fallSide*(.14*recoil+.23*eased);
  z.fallRig.position.y=.89-.51*eased+kick;
  z.chest.rotation.x=z.asset.base.torso.x-.10-.35*eased;
  z.chest.rotation.z=z.asset.base.torso.z+z.fallSide*.12*eased;
  z.neck.rotation.x=z.asset.base.head.x+.10+.14*eased;
  z.legL.rotation.x=z.asset.base.leftLeg.x+.16+.31*eased;
  z.legR.rotation.x=z.asset.base.rightLeg.x-.19-.43*eased;
  z.kneeL.rotation.x=-.25*eased;
  z.kneeR.rotation.x=-.69*eased;
  z.armL.rotation.x=z.asset.base.leftArm.x-.55+1.65*eased;
  z.armR.rotation.x=z.asset.base.rightArm.x-.55+1.45*eased;
  z.armL.rotation.z=z.asset.base.leftArm.z-.43*eased;
  z.armR.rotation.z=z.asset.base.rightArm.z+.5*eased;
  z.root.position.x=z.deathOriginX+z.fallSide*.20*eased;
  z.root.position.z=z.deathOriginZ+Math.cos(z.root.rotation.y)*.19*eased;
  // Body stays on the floor long enough to actually see what happened.
  const sink=clamp((t-(z.deathLength-1.5))/1.5,0,1);
  z.fallRig.position.y-=sink*.65;
  if(z.deathT>z.deathLength){
   scene.remove(z.root);
   if(z.puddle)scene.remove(z.puddle);
   corpses.splice(i,1);
  }
 }
}

const particles = [];

const bloodMat2 = new THREE.MeshBasicMaterial({ color: 0x5c0f0f });
const tracerMat = new THREE.MeshBasicMaterial({ color: 0xffde7a, transparent:true, opacity:.95, depthWrite:false });
const tracerCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:.92, depthWrite:false });

function spawnTracer(from,to){
  const dir=to.clone().sub(from);
  const len=dir.length();
  if(len<0.08)return;
  const group=new THREE.Group();
  const outer=new THREE.Mesh(BOXGEO,tracerMat);
  outer.scale.set(.024,.024,Math.max(.18,len));
  const inner=new THREE.Mesh(BOXGEO,tracerCoreMat);
  inner.scale.set(.010,.010,Math.max(.12,len*.92));
  group.add(outer);group.add(inner);
  group.position.copy(from).addScaledVector(dir,.5);
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir.clone().normalize());
  scene.add(group);
  particles.push({m:group,v:new THREE.Vector3(),life:.055,max:.055,tracer:true});
}

function spawnBlood(pos, count, power){
  for(let i=0;i<count;i++){
    const m = new THREE.Mesh(BOXGEO, Math.random()>0.5 ? bloodMat : bloodMat2);
    const s = rnd(0.05, 0.13);
    m.scale.setScalar(s);
    m.position.copy(pos);
    scene.add(m);
    particles.push({
      m,
      v: new THREE.Vector3(rnd(-1,1)*power, rnd(0.4,1.4)*power, rnd(-1,1)*power),
      life: rnd(0.5, 1.1),
      max: 1
    });
  }
}

const raycaster=new THREE.Raycaster();
function hitZombie(z,point,damage,isHead){
 if(z.dead)return;
 z.hp-=isHead?Math.round(damage*z.headArmor):damage;z.hitT=.36;z.speed=Math.max(.4,z.speed);
 spawnBlood(point,isHead?8:5,isHead?4.3:2.7);
 if(isHead)SFX.head();else SFX.hit();
 crosshair.classList.add('hit');setTimeout(()=>crosshair.classList.remove('hit'),95);
 damageDealt+=damage;if(z.hp<=0)killZombie(z,isHead);
}
function meleeSlash(){
 const w=WEAPONS[selectedWeapon];
 animSlash=1;gunKick=.85;shake=Math.max(shake,.11);
 sNoise(.19,.26,1100,'highpass');sBeep(240,.18,.07,'sawtooth',115);
 let targets=0;
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
 const sorted=zombies.slice().sort((a,b)=>a.root.position.distanceToSquared(camera.position)-b.root.position.distanceToSquared(camera.position));
 for(const z of sorted){
  const dx=z.root.position.x-camera.position.x,dz=z.root.position.z-camera.position.z;
  const dist=Math.hypot(dx,dz);if(dist>w.range||dist<.1)continue;
  if((dx*fx+dz*fz)/dist<.67)continue;
  const from=camera.position.clone(),to=z.root.position.clone().add(new THREE.Vector3(0,1.14,0));
  const direction=to.sub(from),len=direction.length();
  raycaster.set(from,direction.normalize());raycaster.far=len;
  const blockers=raycaster.intersectObjects(houseWalls,false);
  if(blockers.length&&blockers[0].distance<len-.16)continue;
  hitZombie(z,new THREE.Vector3(z.root.position.x,1.2,z.root.position.z),w.damage,false);
  if(++targets>=3)break;
 }
}
function fire(){
 const w=WEAPONS[selectedWeapon],slot=getAmmo();
 if(reloading)return;
 if(w.mode==='melee'){
  fireCd=w.rate;meleeSlash();return;
 }
 if(slot.ammo<=0){SFX.dry();tryReload();fireCd=.24;return;}
 slot.ammo--;fireCd=w.rate;gunKick=1;animShot=1;
 recoil+=selectedWeapon===2?.085:selectedWeapon===3?.10:.024;
 shake=Math.max(shake,selectedWeapon===2?.19:.11);
 muzzleT=.075;muzzleLight.intensity=selectedWeapon===3?4.2:3.4;
 if(selectedWeapon===3){sNoise(.33,.77,650);sBeep(75,.26,.18,'sawtooth',42);}
 else if(selectedWeapon===2){sNoise(.28,.75,900);sBeep(93,.16,.19,'square',52);}
 else SFX.shot();
 const targets=zombies.map(z=>z.root);
 const objects=targets.concat(houseWalls);
 for(let pellet=0;pellet<w.pellets;pellet++){
  const dir=new THREE.Vector3(rnd(-w.spread,w.spread),rnd(-w.spread,w.spread),-1).normalize();
  raycaster.setFromCamera({x:0,y:0},camera);
  raycaster.ray.direction.copy(dir.applyQuaternion(camera.quaternion));raycaster.far=w.range;
  const start=raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(.55));
  const hits=raycaster.intersectObjects(objects,true);
  if(!hits.length){
   const end=start.clone().add(raycaster.ray.direction.clone().multiplyScalar(Math.min(18,w.range)));
   spawnTracer(start,end);
   continue;
  }
  const hit=hits[0],z=hit.object.userData.z;
  spawnTracer(start,hit.point.clone());
  if(!z||z.dead)continue;
  const head=hit.object.userData.part==='head';
  const distance=hit.distance;
  const falloff=w.pellets>1?clamp(1-distance/35,.45,1):1;
  hitZombie(z,hit.point,Math.round((head?w.head:w.damage)*falloff),head);
 }
 if(slot.ammo===0&&slot.reserve>0)tryReload();
 updateHUD();
}
function killZombie(z,head=false){
 if(z.dead)return;
 z.dead=true;z.deathT=0;z.headDeath=head;
 z.deathOriginX=z.root.position.x;z.deathOriginZ=z.root.position.z;
 z.fallSide=Math.random()<.5?-1:1;z.deathLength=rnd(8.5,11.5);
 // Real pivot at hip height. Reparenting preserves every limb's original position.
 z.fallRig=new THREE.Group();z.fallRig.position.set(0,.89,0);
 z.root.add(z.fallRig);z.root.remove(z.hips);z.fallRig.add(z.hips);
 z.hips.position.y=-.89;
 const p=z.root.position.clone();p.y=1.14;spawnBlood(p,15,3.2);
 z.puddle=new THREE.Mesh(new THREE.PlaneGeometry(1.55,1.2),
   new THREE.MeshBasicMaterial({color:0x632022,transparent:true,opacity:.75,depthWrite:false,side:THREE.DoubleSide}));
 z.puddle.rotation.x=-Math.PI/2;z.puddle.rotation.z=rnd(0,Math.PI);
 z.puddle.position.set(z.deathOriginX,.045,z.deathOriginZ);
 scene.add(z.puddle);SFX.kill();
 const i=zombies.indexOf(z);if(i>=0)zombies.splice(i,1);
 corpses.push(z);
 if(corpses.length>18){const old=corpses.shift();scene.remove(old.root);if(old.puddle)scene.remove(old.puddle);}
 kills++;credit(7);updateHUD();
}

function updatePlayer(dt){
 const sprint=keys.ShiftLeft||keys.ShiftRight;
 const speed=sprint?6.4:4.6;
 let ix=0,iz=0;
 if(keys.KeyW||keys.ArrowUp)iz++;
 if(keys.KeyS||keys.ArrowDown)iz--;
 if(keys.KeyA||keys.ArrowLeft)ix--;
 if(keys.KeyD||keys.ArrowRight)ix++;
 ix+=touchMoveX;iz+=touchMoveZ;
 const length=Math.hypot(ix,iz);if(length){ix/=length;iz/=length;}
 const s=Math.sin(yaw),c=Math.cos(yaw);
 const dx=(-s*iz+c*ix)*speed*dt,dz=(-c*iz-s*ix)*speed*dt;
 const nextX=clamp(camera.position.x+dx,-ARENA+1.15,ARENA-1.15);
 if(!obstructed(nextX,camera.position.z,.39))camera.position.x=nextX;
 const nextZ=clamp(camera.position.z+dz,-HOUSE_Z+1.15,HOUSE_Z-1.15);
 if(!obstructed(camera.position.x,nextZ,.39))camera.position.z=nextZ;
 bobT+=dt*(sprint?12:9)*(length>0?1:0);
 const bobY=Math.sin(bobT)*.025*(length>0?1:0),bobX=Math.cos(bobT*.5)*.016*(length>0?1:0);
 shake=Math.max(0,shake-dt*2.6);
 recoil*=Math.pow(.0009,dt);
 camera.position.y=1.68+bobY;
 camera.rotation.y=yaw+rnd(-1,1)*shake*.025;
 camera.rotation.x=clamp(pitch+recoil+rnd(-1,1)*shake*.025,-1.55,1.55);
 camera.rotation.z=bobX*.3;
 if(muzzleT>0){
  muzzleT-=dt;muzzleLight.intensity=3.2;
 }else{
  muzzleLight.intensity*=Math.pow(.0001,dt);
  if(muzzleLight.intensity<.01)muzzleLight.intensity=0;
 }
 if(reloading){
  reloadT-=dt;
  if(reloadT<=0){
   reloading=false;
   const slot=getAmmo(),w=WEAPONS[selectedWeapon];
   const amount=Math.min(w.mag-slot.ammo,slot.reserve);
   slot.ammo+=amount;slot.reserve-=amount;updateHUD();
  }
 }
 animateGun(dt,ix,iz,bobY);
 updateLocation();
}
function updateWeapon(dt){
 if(fireCd>0)fireCd-=dt;
 if(!mouseDown){triggerLatched=false;return;}
 if(state!=='playing'||reloading||fireCd>0)return;
 const w=WEAPONS[selectedWeapon];
 if(w.mode==='auto'||!triggerLatched){fire();triggerLatched=true;}
}
function updateZombies(dt){
 buildNavigation(dt);
 const px=camera.position.x,pz=camera.position.z;
 for(const z of zombies){
  if(z.dead)continue;
  const dx=px-z.root.position.x,dz=pz-z.root.position.z;
  const dist=Math.hypot(dx,dz)||.001;
  const target=zombieTarget(z,px,pz);
  const wx=target.x-z.root.position.x,wz=target.z-z.root.position.z;
  const wdist=Math.hypot(wx,wz)||.001;
  const mvX=wx/wdist,mvZ=wz/wdist;
  const targetRot=Math.atan2(mvX,mvZ);
  let difference=targetRot-z.root.rotation.y;
  while(difference>Math.PI)difference-=Math.PI*2;
  while(difference<-Math.PI)difference+=Math.PI*2;
  z.root.rotation.y+=difference*Math.min(1,dt*4.5);
  let moved=false;
  if(dist>1.25){
   const speed=z.speed*dt*(z.hitT>0?.65:1);
   const stepX=mvX*speed,stepZ=mvZ*speed;
   const nx=z.root.position.x+stepX,nz=z.root.position.z+stepZ;
   if(!obstructed(nx,z.root.position.z,.39)){z.root.position.x=nx;moved=true;}
   if(!obstructed(z.root.position.x,nz,.39)){z.root.position.z=nz;moved=true;}
   if(!moved){ // обход близкой мебели, но без прохождения сквозь стены
    const sideX=-mvZ*speed*.85,sideZ=mvX*speed*.85;
    if(!obstructed(z.root.position.x+sideX,z.root.position.z+sideZ,.39)){
     z.root.position.x+=sideX;z.root.position.z+=sideZ;moved=true;
    }
   }
  }
  animateZombie(z,dt,moved,dist);
  z.atkCd-=dt;
  if(dist<(z.type==='brute'?2.0:1.65)&&z.atkCd<=0){
   z.atkCd=z.attackRate;
   z.attackT=.5;
   hurtPlayer(z.attackDamage);
   if(Math.random()<.24)SFX.groan();
  }
 }
 // Separation to avoid unrealistic stacking. Only push if the landing cell is valid.
 const minD=.76;
 for(let i=0;i<zombies.length;i++)for(let j=i+1;j<zombies.length;j++){
  const a=zombies[i],b=zombies[j];
  const dx=b.root.position.x-a.root.position.x,dz=b.root.position.z-a.root.position.z;
  const d2=dx*dx+dz*dz;if(d2>minD*minD||d2<.0001)continue;
  const d=Math.sqrt(d2),push=(minD-d)/d*.25;
  const ax=a.root.position.x-dx*push,az=a.root.position.z-dz*push;
  const bx=b.root.position.x+dx*push,bz=b.root.position.z+dz*push;
  if(!obstructed(ax,az,.35))a.root.position.set(ax,a.root.position.y,az);
  if(!obstructed(bx,bz,.35))b.root.position.set(bx,b.root.position.y,bz);
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.life-=dt;
  if(p.life<=0){scene.remove(p.m);particles.splice(i,1);continue;}
  if(p.tracer){
   const alpha=clamp(p.life/p.max,0,1);
   p.m.children[0].material.opacity=.95*alpha;
   p.m.children[1].material.opacity=.92*alpha;
   continue;
  }
  p.v.y-=14*dt;p.m.position.addScaledVector(p.v,dt);
  if(p.m.position.y<.07){p.m.position.y=.07;p.v.multiplyScalar(.30);p.v.y*=-.2;}
  p.m.rotation.x+=dt*5;p.m.rotation.y+=dt*3;
  p.m.scale.multiplyScalar(Math.max(.8,1-dt*.8));
 }
}
function updateWaves(dt){
 if(waveActive){
  if(toSpawn>0){
   spawnT-=dt;
   if(spawnT<=0&&zombies.length<48){
    makeZombie();toSpawn--;
    spawnT=Math.max(.16,.95-wave*.045);
    if(Math.random()<.19)SFX.groan();updateHUD();
   }
  }else if(zombies.length===0){
   waveActive=false;breakT=5;
   playerHp=Math.min(maxPlayerHp,playerHp+22);
   credit(40+wave*8);
   for(let i=0;i<WEAPONS.length;i++)ammoState[i].reserve+=WEAPONS[i].bonus;
   showMsg('ВОЛНА '+wave+' ЗАЧИЩЕНА · +22 HP · ПАТРОНЫ',3.5);
   updateHUD();SFX.wave();
  }
 }else{
  breakT-=dt;if(breakT<=0)startWave();
 }
}
function updateMessages(dt){
 if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.classList.remove('show');}
}
function updateAtmosphere(dt,now){
 for(const f of lightsToFlicker){
  f.light.intensity=f.base*(.82+.18*Math.sin(now*.0013+f.phase)+.07*Math.sin(now*.008+f.phase*3));
 }

}

   СЕНСОРНЫЕ КНОПКИ И ДЖОЙСТИК
   ============================================================ */
if(isTouchDevice){
 const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');
 let joystickPointer=null;
 function moveJoystick(e){
  const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.32,len=Math.hypot(dx,dy)||1;
  const factor=Math.min(1,max/len),x=dx*factor,y=dy*factor;
  touchMoveX=x/max;touchMoveZ=-y/max;
  knob.style.transform=`translate(${x}px,${y}px)`;
 }
 base.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();joystickPointer=e.pointerId;base.setPointerCapture(e.pointerId);moveJoystick(e);});
 base.addEventListener('pointermove',e=>{if(joystickPointer===e.pointerId)moveJoystick(e);});
 function stopJoy(e){if(joystickPointer!==e.pointerId)return;joystickPointer=null;touchMoveX=touchMoveZ=0;knob.style.transform='';}
 base.addEventListener('pointerup',stopJoy);base.addEventListener('pointercancel',stopJoy);
 const fire=document.getElementById('fireTouch');
 fire.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();fire.setPointerCapture(e.pointerId);mouseDown=true;triggerLatched=false;fire.classList.add('pressed');});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(type,()=>{mouseDown=false;triggerLatched=false;fire.classList.remove('pressed');});
 document.getElementById('reloadTouch').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing')tryReload();});
 const run=document.getElementById('runTouch');
 run.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing')return;run.setPointerCapture(e.pointerId);keys.ShiftLeft=true;run.classList.add('pressed');});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])run.addEventListener(type,()=>{keys.ShiftLeft=false;run.classList.remove('pressed');});
 document.getElementById('mapTouch').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing')document.getElementById('floorplan').classList.toggle('visible');});
 document.getElementById('pauseTouch').addEventListener('pointerdown',e=>{e.preventDefault();pauseGame();});
 const canvas=renderer.domElement;
 canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||e.clientX<window.innerWidth*.32)return;lookPointer=e.pointerId;lookX=e.clientX;lookY=e.clientY;canvas.setPointerCapture(e.pointerId);});
 canvas.addEventListener('pointermove',e=>{if(lookPointer!==e.pointerId||state!=='playing')return;const dx=e.clientX-lookX,dy=e.clientY-lookY;lookX=e.clientX;lookY=e.clientY;
  yaw-=dx*.0042;pitch=clamp(pitch-dy*.0042,-1.35,1.35);});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{if(e.pointerId===lookPointer)lookPointer=null;});
 document.addEventListener('touchmove',e=>{if(state==='playing')e.preventDefault();},{passive:false});
}

/* ============================================================
   13. ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let last = performance.now();

function loop(now){
  requestAnimationFrame(loop);

  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.06) dt = 0.06;

  if(state === 'playing'){
    updatePlayer(dt);
    updateWeapon(dt);
    updateZombies(dt);
    updateCorpses(dt);
    updateWaves(dt);
    updateAtmosphere(dt,now);
    drawFloorplan();
  }
  updateParticles(dt);
  updateMessages(dt);

  renderer.render(scene, camera);
  if(preview&&state==='menu'&&preview.renderer.domElement.isConnected){
   preview.character.rotation.y=-.12+Math.sin(now*.00045)*.10;
   preview.character.position.y=Math.sin(now*.0019)*.035;
   preview.renderer.render(preview.scene,preview.camera);
  }
}

/* ============================================================
   14. СТАРТ
   ============================================================ */
resetGame();
camera.position.set(8.5, 1.68, 23.8);
showMainMenu();
requestAnimationFrame(loop);

// авто-пауза при потере фокуса
window.addEventListener('blur', ()=>{
  if(state === 'playing'&&!isTouchDevice){ pauseGame(); }
});

})();
</script>
